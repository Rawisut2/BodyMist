<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1 class="section-head__title page-title">รายการสั่งซื้อ</h1>
          <span class="mood-dots" aria-hidden="true">
            <span class="mood-dot" data-mood="fresh"></span>
            <span class="mood-dot" data-mood="sweet"></span>
            <span class="mood-dot" data-mood="confident"></span>
            <span class="mood-dot" data-mood="romance"></span>
          </span>
          <p class="section-head__lead">เรียงจากรายการล่าสุดขึ้นก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable" class="data-table">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__grid">
        <a class="brand" href="index.html">Body Scent</a>
        <nav class="site-footer__nav" aria-label="ลิงก์ท้ายหน้า">
          <a href="index.html">หน้าแรก</a>
          <a href="product.html">สินค้า</a>
        </nav>
      </div>
      <p class="site-footer__bottom">© 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
